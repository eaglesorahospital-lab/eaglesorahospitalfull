<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="hospital-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a2540" />
      <stop offset="100%" stop-color="#0d6efd" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.25" />
    </filter>
  </defs>
  <!-- Rounded Base Card -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#hospital-grad)" filter="url(#shadow)" />
  <!-- Medical Cross Accent -->
  <rect x="27" y="14" width="10" height="36" rx="4" fill="#ffffff" opacity="0.2" />
  <rect x="14" y="27" width="36" height="10" rx="4" fill="#ffffff" opacity="0.2" />
  <!-- Pulse Activity Line -->
  <path d="M 12 32 L 22 32 L 27 20 L 33 44 L 39 25 L 43 36 L 47 32 L 52 32"
        fill="none"
        stroke="#ffffff"
        stroke-width="4.5"
        stroke-linecap="round"
        stroke-linejoin="round" />
  <!-- Emergency Green Dot -->
  <circle cx="48" cy="16" r="4.5" fill="#10b981" />
</svg>
